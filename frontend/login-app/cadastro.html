<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Hotel CheckQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Novo Cadastro</h1>
            <p>Preencha os dados para criar sua conta.</p>
        </header>

        <form id="cadastroForm">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="input-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" required placeholder="Apenas números">
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>

            <div class="input-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" required>
            </div>

            <div class="input-group">
                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" id="data_nascimento" required>
            </div>

            <div class="input-group">
                <label for="senha">Crie uma Senha</label>
                <input type="password" id="senha" required>
            </div>

            <button type="submit" id="submitBtn">Criar Conta</button>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Já tem uma conta? <a href="login.html" style="color: var(--color-primary-600); font-weight: 600; text-decoration: none;">Voltar ao Login</a>
            </p>
        </form>
        <div id="mensagemFeedback" style="margin-top: 1rem; text-align: center; font-weight: 500; font-size: 0.9rem;"></div>
    </main>

    <script src="cadastro.js"></script>
</body>
</html>
