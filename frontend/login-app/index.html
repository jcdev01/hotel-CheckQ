<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acesso - Hotel CheckQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Portal do Hotel</h1>
            <p>Identifique-se para acessar o sistema.</p>
        </header>

        <form id="loginForm">
            <div class="input-group">
                <label for="identificacao">E-mail (Hóspede) ou Usuário (Recepção)</label>
                <input type="text" id="identificacao" name="identificacao" required placeholder="exemplo@email.com ou admin">
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <button type="submit" id="submitBtn">Entrar no Sistema</button>
        </form>
        <div id="mensagemFeedback" style="margin-top: 1.5rem; text-align: center; font-weight: 500; font-size: 0.9rem;"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
