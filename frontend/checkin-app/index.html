<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel CheckQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app-container">

    <section id="welcomeScreen" class="screen welcome-screen">
        <div class="welcome-card">
            <div class="logo" aria-label="Hotel CheckQ">🏨</div>
            <h1>Olá, Jairo!</h1>
            <p class="welcome-text">
                Bem-vindo ao <strong>Hotel CheckQ</strong>.
                Quando estiver pronto, solicite seu check-in
                e acompanhe sua posição na fila.
            </p>
            <button type="button" id="startCheckinBtn" class="primary-button">
                Solicitar check-in <span aria-hidden="true">→</span>
            </button>

            <button type="button" id="logoutBtn" class="logout-button">
                Sair da conta
            </button>
            
            <p class="service-hours">
                <span aria-hidden="true">◷</span>
                Horário de atendimento: 08h às 22h
            </p>
        </div>
    </section>

    <section id="checkinScreen" class="screen checkin-screen hidden">
        <div class="checkin-card">
            <button type="button" id="backBtn" class="back-button">← Voltar</button>

            <header>
                <h1>Solicitar Check-in</h1>
                <p>Preencha os dados abaixo para entrar na fila da recepção.</p>
            </header>

            <form id="checkinForm">
                <div class="input-group">
                    <label for="nome_hospede">Nome Completo</label>
                    <input type="text" id="nome_hospede" name="nome_hospede"
                           autocomplete="name" required>
                </div>

                <div class="input-group">
                    <label for="numero_quarto">Número do Quarto</label>
                    <input type="number" id="numero_quarto" name="numero_quarto"
                           min="1" required>
                </div>

                <div class="input-group">
                    <label for="horario_entrada">Data e Hora de Entrada</label>
                    <input type="datetime-local" id="horario_entrada"
                           name="horario_entrada" required>
                </div>

                <div class="input-group">
                    <label for="horario_saida">Data e Hora de Saída</label>
                    <input type="datetime-local" id="horario_saida"
                           name="horario_saida" required>
                </div>

                <button type="submit" id="submitBtn" class="primary-button">
                    Entrar na Fila
                </button>
            </form>

            <div id="mensagemFeedback" role="status" aria-live="polite"></div>
        </div>
    </section>

</main>
<script src="script.js"></script>
</body>
</html>
